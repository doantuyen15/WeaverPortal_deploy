  <!-- Security: Content Security Policy (CSP) to prevent XSS -->
  <!--
    Faye Voice additions (per src/features/fayeVoice + voice-service/):
      - script-src  *.daily.co     → @pipecat-ai/small-webrtc-transport pulls in
                                     @daily-co/daily-js which fetches a remote
                                     "call object bundle" from c.daily.co at runtime.
                                     No SDK opt-out exists. Sentry telemetry from the
                                     same bundle stays blocked (separate domain).
      - script-src  'unsafe-eval'  → Daily's call-machine bundle uses eval() / new
                                     Function() internally. Without 'unsafe-eval'
                                     the bundle loads but fails to evaluate.
                                     Tradeoff: weakens XSS posture (combined with
                                     existing 'unsafe-inline'). Scoped to this app
                                     only because Faye Voice can't function without
                                     it. Revisit if Daily ever ships a CSP-safe
                                     build (WASM-based or eval-free).
      - connect-src *.daily.co     → Daily's signaling + telemetry endpoints.
      - connect-src *.fly.dev      → voice-service/ Fly.io app (prod).
                                     `*.run.app` is kept for now in case we
                                     ever spin Cloud Run back up for diagnostics,
                                     but the active prod URL is *.fly.dev.
      - media-src   blob:          → Pipecat audio playback may surface tracks as
                                     blob URLs via MediaStream.
      - worker-src 'self' blob:    → Daily-js uses Web Workers, some via blob:.
      - script-src  blob:          → Daily injects AudioWorklets from blob URLs.
                                     `script-src-elem` fallback uses `script-src`
                                     so this directive must list blob: too.

    Sentry (crash detection, added 2026-06-16):
      - connect-src o4511446009184256.ingest.us.sentry.io
                                   → @sentry/react envelope POSTs (tag app=weaverportal).
                                     EXACT host, shared by all 3 Weaver Sentry projects
                                     (same org, us region). WITHOUT it every envelope is
                                     silently CSP-blocked → Portal telemetry is DOA (this
                                     meta CSP ships in the built dist/index.html, so it
                                     governs prod on GitHub Pages too). Kept exact, not a
                                     wildcard, so Daily's own bundled Sentry (different org
                                     host) stays blocked per the note above.

    Dictation YouTube player (per src/features/dictation + dictationReview):
      - script-src  www.youtube.com → core/youtubeIframeLoader.js injects
                                     <script src="https://www.youtube.com/iframe_api">
                                     into THIS document. `*.google.com` does NOT
                                     cover youtube.com, so without this the API
                                     script is refused and no YT.Player is ever built.
      - frame-src   www.youtube.com → the embed iframe useSegmentPlayer.js mounts
                                     (https://www.youtube.com/embed/<id>). Without it
                                     the player container renders a flat black box
                                     (bg-black) with no iframe. youtube-nocookie.com is
                                     listed too so a future privacy-mode switch works.
                                     (Resources loaded INSIDE the cross-origin iframe —
                                     player JS, *.googlevideo.com media — are governed by
                                     the iframe's own origin, not this parent CSP, so no
                                     connect-src/media-src changes are needed.) This meta
                                     CSP ships in dist/index.html, so it governs prod too.

    LAN / phone testing — do NOT edit this policy for it:
      The emulator origins below are literal `http://localhost:<port>`, which is
      right for the PC but breaks a phone on the LAN: src/lib/firebase.js dials
      the emulators at window.location.hostname, so a page served from
      http://192.168.x.x:5173 dials http://192.168.x.x:9099 — a different PORT
      than the page origin, so `'self'` doesn't cover it and it isn't listed.
      Every Firebase call is then CSP-blocked and surfaces as
      `auth/network-request-failed` (looks like a firewall/emulator fault; isn't).
      The fix is the DEV-ONLY `lanDevCsp()` plugin in vite.config.js, which
      injects this machine's IPv4 addresses into the dev server's HTML only
      (`apply: 'serve'` ⇒ dist/ is byte-identical). Never hardcode a LAN address
      here — this meta CSP is what gh-pages serves to real students.
  -->
  <meta http-equiv="Content-Security-Policy"
    content="default-src 'self'; frame-src 'self' http://localhost:3001 https://test.weaver.edu.vn https://*.weaver.edu.vn https://*.firebaseapp.com https://*.google.com https://*.googleapis.com http://*.google.com http://*.googleapis.com https://www.youtube.com https://www.youtube-nocookie.com; script-src 'self' 'unsafe-inline' 'unsafe-eval' blob: https://*.google.com https://*.googleapis.com http://*.google.com http://*.googleapis.com https://www.gstatic.com http://*.gstatic.com https://www.googletagmanager.com https://*.firebaseio.com https://*.firebasedatabase.app https://*.daily.co https://www.youtube.com; worker-src 'self' blob:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://p.typekit.net; font-src 'self' https://fonts.gstatic.com https://use.typekit.net https://p.typekit.net data:; img-src 'self' data: https://* http://*.google.com http://*.gstatic.com https://*.googleusercontent.com https://ui-avatars.com https://grainy-gradients.vercel.app https://www.googletagmanager.com https://*.google.com https://*.gstatic.com; media-src 'self' blob: https://firebasestorage.googleapis.com https://*.googleapis.com;     connect-src 'self' http://localhost:5001 http://localhost:9099 http://localhost:8080 http://localhost:9000 http://localhost:5201 http://localhost:9281 http://localhost:8281 http://localhost:9190 http://localhost:9381 https://*.google.com https://*.googleapis.com http://*.google.com http://*.googleapis.com https://*.firebaseio.com https://*.firebasedatabase.app wss://*.firebaseio.com wss://*.firebasedatabase.app https://*.firebaseapp.com https://*.cloudfunctions.net https://www.google-analytics.com https://*.google-analytics.com https://*.analytics.google.com https://*.stats.g.doubleclick.net https://*.algolia.net https://*.algolianet.com https://*.algolia.io https://*.daily.co wss://*.daily.co https://*.run.app wss://*.run.app https://*.fly.dev wss://*.fly.dev https://o4511446009184256.ingest.us.sentry.io;">
