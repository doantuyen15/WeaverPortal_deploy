  <!-- Security: Content Security Policy (CSP) to prevent XSS -->
  <!--
    Faye Voice was retired 2026-11-01 and took *.daily.co and *.fly.dev with it.
    'unsafe-eval' and blob: in script-src arrived for Daily's call bundle. Nothing in
    src/ calls eval, but they stay until Google sign-in and the YouTube player are
    proven clean without them.

    Sentry (crash detection, added 2026-06-16):
      - connect-src o4511446009184256.ingest.us.sentry.io
                                   → @sentry/react envelope POSTs (tag app=weaverportal).
                                     EXACT host, shared by all 3 Weaver Sentry projects
                                     (same org, us region). WITHOUT it every envelope is
                                     silently CSP-blocked → Portal telemetry is DOA (this
                                     meta CSP ships in the built dist/index.html, so it
                                     governs prod on GitHub Pages too). Kept exact, not a
                                     wildcard.

    Dictation YouTube player (per src/features/dictation + dictationReview):
      - script-src  www.youtube.com → core/youtubeIframeLoader.js injects
                                     <script src="https://www.youtube.com/iframe_api">
                                     into THIS document. `*.google.com` does NOT
                                     cover youtube.com, so without this the API
                                     script is refused and no YT.Player is ever built.
      - frame-src   www.youtube.com → the embed iframe useSegmentPlayer.js mounts
                                     (https://www.youtube.com/embed/<id>). Without it
                                     the player container renders a flat black box
                                     (bg-black) with no iframe. youtube-nocookie.com is
                                     listed too so a future privacy-mode switch works.
                                     (Resources loaded INSIDE the cross-origin iframe —
                                     player JS, *.googlevideo.com media — are governed by
                                     the iframe's own origin, not this parent CSP, so no
                                     connect-src/media-src changes are needed.) This meta
                                     CSP ships in dist/index.html, so it governs prod too.

    LAN / phone testing — do NOT edit this policy for it:
      The emulator origins below are literal `http://localhost:<port>`, which is
      right for the PC but breaks a phone on the LAN: src/lib/firebase.js dials
      the emulators at window.location.hostname, so a page served from
      http://192.168.x.x:5173 dials http://192.168.x.x:9099 — a different PORT
      than the page origin, so `'self'` doesn't cover it and it isn't listed.
      Every Firebase call is then CSP-blocked and surfaces as
      `auth/network-request-failed` (looks like a firewall/emulator fault; isn't).
      The fix is the DEV-ONLY `lanDevCsp()` plugin in vite.config.js, which
      injects this machine's IPv4 addresses into the dev server's HTML only
      (`apply: 'serve'` ⇒ dist/ is byte-identical). Never hardcode a LAN address
      here — this meta CSP is what gh-pages serves to real students.
  -->
  <meta http-equiv="Content-Security-Policy"
    content="default-src 'self'; frame-src 'self' http://localhost:9099 http://localhost:9281 https://*.weaver.edu.vn https://*.firebaseapp.com https://*.google.com https://*.googleapis.com http://*.google.com http://*.googleapis.com https://www.youtube.com https://www.youtube-nocookie.com; script-src 'self' 'unsafe-inline' 'unsafe-eval' blob: https://*.google.com https://*.googleapis.com http://*.google.com http://*.googleapis.com https://www.gstatic.com http://*.gstatic.com https://www.googletagmanager.com https://*.firebaseio.com https://*.firebasedatabase.app https://www.youtube.com; worker-src 'self' blob:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://p.typekit.net; font-src 'self' https://fonts.gstatic.com https://use.typekit.net https://p.typekit.net data:; img-src 'self' data: blob: https://* http://localhost:9190 http://localhost:9381 http://127.0.0.1:9190 http://127.0.0.1:9381 http://*.google.com http://*.gstatic.com https://*.googleusercontent.com https://ui-avatars.com https://grainy-gradients.vercel.app https://www.googletagmanager.com https://*.google.com https://*.gstatic.com; media-src 'self' blob: https://firebasestorage.googleapis.com https://*.googleapis.com;     connect-src 'self' http://localhost:5001 http://localhost:9099 http://localhost:8080 http://localhost:9000 http://localhost:5201 http://localhost:9281 http://localhost:8281 http://localhost:9190 http://localhost:9381 https://*.google.com https://*.googleapis.com http://*.google.com http://*.googleapis.com https://*.firebaseio.com https://*.firebasedatabase.app wss://*.firebaseio.com wss://*.firebasedatabase.app https://*.firebaseapp.com https://*.cloudfunctions.net https://www.google-analytics.com https://*.google-analytics.com https://*.analytics.google.com https://*.stats.g.doubleclick.net https://*.algolia.net https://*.algolianet.com https://*.algolia.io https://*.run.app wss://*.run.app https://o4511446009184256.ingest.us.sentry.io;">
  <!-- Flashcard/vocab-drill audio lives on a public GCS bucket and is fetched by an
       <audio> element on first tap. Warming DNS + TLS here removes the cold-connect
       half of that latency on mobile, where it dominates. NO `crossorigin`: media
